upstream env-demo-08761 {
    server app-env-demo-08761:80;
}

server {
    listen 80;
    server_name env-demo-08761.localhost;

    location / {
        proxy_pass http://env-demo-08761;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Env-ID env-demo-08761;
    }

    location /health {
        proxy_pass http://env-demo-08761/health;
        proxy_set_header Host $host;
    }
}
